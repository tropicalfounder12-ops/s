<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Gym Tracker</h1>
    <div class="nav">
      <button id="prev" class="ghost" aria-label="Previous month">&lsaquo;</button>
      <h2 id="monthLabel"></h2>
      <button id="next" class="ghost" aria-label="Next month">&rsaquo;</button>
      <button id="today" class="ghost">Today</button>
    </div>
  </header>

  <main class="layout">
    <section class="calendar">
      <div class="weekdays">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <aside class="summary">
      <h3>This month</h3>
      <div class="stats">
        <div><span id="statSessions">0</span><small>sessions</small></div>
        <div><span id="statTime">0m</span><small>total time</small></div>
        <div><span id="statDays">0</span><small>active days</small></div>
      </div>
      <h3>By muscle group</h3>
      <ul id="breakdown" class="breakdown"></ul>
    </aside>
  </main>

  <dialog id="dialog">
    <div class="dialog-head">
      <h3 id="dialogTitle"></h3>
      <button id="closeDialog" class="ghost" aria-label="Close">&times;</button>
    </div>
    <ul id="dayList" class="day-list"></ul>
    <form id="form">
      <h4 id="formTitle">Add session</h4>
      <label>Type
        <input id="type" list="types" placeholder="Chest, Legs, Arms, Abs..." required maxlength="40" autocomplete="off">
        <datalist id="types"></datalist>
      </label>
      <label>Duration (minutes)
        <input id="minutes" type="number" min="1" max="1440" step="1" value="60" required>
      </label>
      <label>Notes (optional)
        <textarea id="notes" rows="2" maxlength="1000" placeholder="Exercises, weights, how it felt..."></textarea>
      </label>
      <p id="error" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="cancelEdit" class="ghost" hidden>Cancel edit</button>
        <button type="submit" id="submit">Add session</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
